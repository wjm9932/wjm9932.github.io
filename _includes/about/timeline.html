{% for item in site.data.timeline %}
  <div class="col-12 mb-4">
    <article class="portfolio-card education-card card bg-themed text-themed">
      <div class="card-body">
        <div class="experience-header">
          <div class="experience-heading education-heading">
            <h2 class="portfolio-card-title">{{ item.title }}</h2>
            <span class="education-date">{{ item.from }} — {{ item.to }}</span>
          </div>
        </div>
        <div class="experience-description education-description">{{ item.description }}</div>
      </div>
    </article>
  </div>
{% endfor %}
