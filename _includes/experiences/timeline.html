<div class="col mt-4 experiences-timeline">
  <div class="timeline-body bg-themed">
    {% for item in site.data.experiences %}
      <div class="timeline-item">
        <div class="content">
          <div class="experience-header">
            <div class="experience-title-row">
              <span class="timeline-marker" aria-hidden="true"></span>
              <h2>{{ item.title }}</h2>
            </div>
            <div class="experience-meta">
              {% if item.project %}
                <span class="project"><span class="project-label">Project :</span> <span class="project-name">{{ item.project }}</span>{% if item.engine %}<span class="engine-badge">{{ item.engine }}</span>{% endif %}</span>
              {% endif %}
              <div class="experience-company-row">
                <span class="company">{{ item.company }}</span>
                <h6 class="date">{{ item.from }} — {{ item.to }}</h6>
              </div>
            </div>
          </div>
          <div class="description">{{ item.description }}</div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
